<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Films</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="wrap">
    <header class="shop-head" style="margin-bottom:22px">
      <div><div class="eyebrow">Try-ons, fabric close-ups and live replays</div><h1>Films</h1></div>
    </header>
    <div class="films" id="list" style="padding-bottom:60px"></div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { esc, money } = Store;
      await Store.chrome('videos');
      const videos = await Store.api('/videos');
      const list = document.getElementById('list');
      list.innerHTML = videos.length ? videos.map((v) => `
        <div class="film reveal">
          <video src="${esc(v.file)}" controls playsinline preload="metadata"></video>
          <div class="cap">
            <h3>${esc(v.title)}</h3>
            ${v.description ? `<div class="small muted">${esc(v.description)}</div>` : ''}
            ${v.product_name ? `<a class="u-link small" href="/product?id=${v.product_id}">Shop the ${esc(v.product_name)}, ${money(v.product_price)}</a>` : ''}
          </div>
        </div>`).join('')
        : '<div class="empty" style="grid-column:1/-1"><p class="muted">No films yet. Check back soon.</p></div>';
      list.addEventListener('play', (e) => list.querySelectorAll('video').forEach((v) => { if (v !== e.target) v.pause(); }), true);
      Store.reveal();
    })();
  </script>
</body>
</html>
