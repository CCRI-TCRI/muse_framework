<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="narrow" style="padding-top:clamp(48px,8vw,120px);padding-bottom:clamp(64px,9vw,140px)">
    <div id="out"><p class="muted">Confirming your payment...</p></div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    (async () => {
      const { esc, money } = Store;
      await Store.chrome('bag');
      const q = new URLSearchParams(location.search);
      const out = document.getElementById('out');
      try {
        const o = await Store.api('/orders/confirm?' + new URLSearchParams({
          session_id: q.get('session_id') || '', order: q.get('order') || '', token: q.get('token') || '',
        }));
        if (o.status === 'paid' || o.status === 'shipped') {
          Store.writeBag([]);
          out.innerHTML = `
            <div class="eyebrow">Order no. ${o.id}</div>
            <h1 style="font-size:clamp(44px,6vw,84px);margin:16px 0 22px">Thank you</h1>
            <p class="muted">Your order is confirmed${o.email ? ` and a receipt is on its way to ${esc(o.email)}` : ''}. We'll let you know as soon as it ships.</p>
            ${o.demo ? '<p class="note">This was a test order. No card was charged.</p>' : ''}
            <div style="margin:40px 0;border-top:1px solid var(--line)">
              ${o.items.map((i) => `<div class="totals" style="padding:16px 0;border-bottom:1px solid var(--line)">
                <span>${i.quantity} &times; ${esc(i.name)}${i.size ? `, ${esc(i.size)}` : ''}</span><span>${money(i.unit_price_cents * i.quantity)}</span></div>`).join('')}
              <div class="totals big" style="padding:20px 0"><span>Total</span><span>${money(o.total_cents)}</span></div>
            </div>
            <a class="btn" href="/shop">Continue shopping</a>`;
        } else if (o.status === 'unpaid') {
          out.innerHTML = `<h1 style="font-size:48px;margin-bottom:18px">Almost there</h1><p class="muted">Your bank hasn't confirmed the payment yet. Refresh this page in a minute. If it doesn't go through, you won't be charged.</p>`;
        } else {
          out.innerHTML = `<h1 style="font-size:48px;margin-bottom:18px">We couldn't find that order</h1><a class="u-link" href="/shop">Back to the shop</a>`;
        }
      } catch (err) {
        out.innerHTML = `<h1 style="font-size:48px;margin-bottom:18px">Something went wrong</h1><p class="muted">${esc(err.message)} If you were charged, your order is safe. Refresh this page to try again.</p>`;
      }
    })();
  </script>
</body>
</html>
