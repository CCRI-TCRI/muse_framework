<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main>
    <section class="theater">
      <div class="wrap">
        <div class="stage">
          <video id="video" autoplay playsinline muted class="hidden"></video>
          <div class="badge hidden" id="badge"><span class="on-air">Live</span><span id="count">0 watching</span></div>
          <button class="btn light sm sound hidden" id="unmute">Tap for sound</button>
          <div class="idle" id="idle">
            <div class="eyebrow">Live try-ons</div>
            <h2>We're off air</h2>
            <p class="small" style="color:rgba(236,232,225,.7)">Keep this page open and the next session will start here by itself. Until then, have a look at our <a class="u-link" href="/videos">films</a>.</p>
          </div>
          <div class="pinned hidden" id="pinned"></div>
        </div>
        <aside class="chat">
          <div class="chat-head eyebrow">Chat</div>
          <div class="log" id="log"><div class="small" style="opacity:.55">Chat opens when we go live.</div></div>
          <form id="chat-form">
            <input id="name" placeholder="Name" maxlength="30" aria-label="Your name">
            <input id="text" placeholder="Ask a question" maxlength="300" autocomplete="off" aria-label="Message">
            <button class="btn sm">Send</button>
          </form>
        </aside>
      </div>
    </section>
    <section class="wrap stream-title">
      <div class="eyebrow" id="sub">Live shopping</div>
      <h1 id="title">Watch, ask, and buy as we try things on</h1>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/live-viewer.js"></script>
</body>
</html>
